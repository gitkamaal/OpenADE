name: Go/Wails desktop CI
on:
  push:
    branches: [main, feature/go-wails-ade]
  pull_request:
permissions:
  contents: read
jobs:
  desktop:
    name: Build, static checks and end-to-end flows
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/desktop/go.mod
          cache-dependency-path: apps/desktop/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build
      - run: go vet ./...
      - run: npm run e2e
      # Rebuild without the fixture URL/token before packaging the native client.
      - run: npm run build
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - run: wails build -m -skipbindings -s
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-evidence
          path: apps/desktop/test-results/
